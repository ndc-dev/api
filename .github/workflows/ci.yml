name: CI

# 依存を更新したときに壊れていないかを見るためのチェック。
# Dependabot の PR にもこれが走るので、更新して安全かどうかが分かる。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

# 同じブランチで新しい push があったら、古い実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 静的解析とスモークテスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Python 自体も uv が pyproject.toml の requires-python を見て用意する
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked は「uv.lock が pyproject.toml と揃っていること」も検査する。
      # --frozen は lock の中身をそのまま使うだけで、ずれを検出しない。
      # Dockerfile は --frozen なので、ずれの検出はここでしか行われない。
      - name: Install
        run: uv sync --locked

      # --output-format=github を付けると、PR の該当行に注釈が出る
      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: フォーマットの確認
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      # main.py は読み込むだけで zips/ を展開して NDC を全件パースするので、
      # import できること自体が ndc-parser と FastAPI のスモークテストになる。
      # テストが無いためこれが唯一の実行時チェック。
      - name: 読み込み確認
        if: ${{ !cancelled() }}
        run: uv run python -c "import main; print(len(main.ndc8_items), len(main.ndc9_items))"

  docker:
    name: Dockerイメージ
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Buildxをセットアップ
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: イメージをビルド
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: ndc-dev-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 本番と同じ gunicorn + UvicornWorker で実際に応答するところまで見る。
      # 起動時に NDC を展開するので、応答までしばらくかかる。
      - name: 起動確認 (スモークテスト)
        run: |
          docker run -d --name ndc-dev-api-ci -p 8080:8080 ndc-dev-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ndc9/123 -o /dev/null; then
              echo "分類項目の応答を確認しました"
              exit 0
            fi
            sleep 2
          done
          echo "::error::コンテナが起動しませんでした"
          docker logs ndc-dev-api-ci
          exit 1

      - name: コンテナを片付ける
        if: always()
        run: docker rm -f ndc-dev-api-ci || true

  done:
    name: CI 完了
    # ブランチ保護の必須チェックにはこのジョブだけを指定する。
    # ジョブを増減しても保護の設定を変えずに済む。
    needs: [check, docker]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 各ジョブの結果を確認
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "各ジョブの結果: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::成功しなかったジョブがあります"
              exit 1
            fi
          done
