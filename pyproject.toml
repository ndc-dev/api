[project]
name = "ndc-dev-api"
version = "0.1.0"
description = "NDC (Nippon Decimal Classification) API for Developer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "gunicorn>=26.0.0",
    "ndc-parser>=0.1",
    "orjson>=3.11.9",
    "uvicorn>=0.52.1",
    "uvicorn-worker>=0.4.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "requests>=2.34.2",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.format]
quote-style = "single"
# ruff format は Markdown 内の Python コードブロックも既定で整形対象にする。
# README の説明用コードまで書き換わって差分が膨らむので外す。
# ruff check のほうは Markdown を見ない（"No Python files found" になる）ので、
# lint と format のスコープを揃える意味もある。
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "RUF100", # 効かなくなった noqa を検出する
]
ignore = [
    "B008",   # FastAPI の Depends() を既定値に置くパターン
]
